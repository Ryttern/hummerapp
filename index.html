<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HummerLogg PRO</title>
    
    <!-- Leaflet CSS for Kart -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- QRCode.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-orange: #f97316;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }

        .header {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--accent-blue);
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }

        .card h2 {
            margin-top: 0;
            font-size: 1rem;
            color: var(--text-sub);
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }

        .teine-select-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-teine {
            background-color: #334155;
            color: white;
            border: 2px solid transparent;
            padding: 12px 5px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .btn-teine.selected {
            border-color: var(--accent-blue);
            background-color: #0284c7;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .counter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #334155;
        }

        .counter-row:last-child {
            border-bottom: none;
        }

        .counter-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-counter {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-minus { background-color: #475569; }
        .btn-plus { background-color: var(--accent-blue); }

        .counter-val {
            font-size: 1.2rem;
            font-weight: bold;
            width: 24px;
            text-align: center;
        }

        .btn-action {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-primary { background-color: var(--accent-blue); }
        .btn-success { background-color: var(--accent-green); }
        .btn-warning { background-color: var(--accent-orange); }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #334155;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent-blue);
        }

        .nav-item-icon {
            font-size: 1.2rem;
        }

        #map {
            width: 100%;
            height: 400px;
            border-radius: 12px;
            margin-top: 10px;
        }

        .history-item {
            background-color: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            border-left: 4px solid var(--accent-blue);
        }

        #qrcode {
            display: flex;
            justify-content: center;
            padding: 15px;
            background: white;
            border-radius: 8px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🦞 HummerLogg PRO</h1>
    </div>

    <div class="container">
        
        <!-- TAB 1: REGISTRERING -->
        <div id="tab-register" class="tab-content active">
            <div class="card">
                <h2>1. VELG TEINE</h2>
                <div class="teine-select-grid">
                    <button class="btn-teine selected" onclick="selectTeine('TEINE-01')">TEINE-01</button>
                    <button class="btn-teine" onclick="selectTeine('TEINE-02')">TEINE-02</button>
                    <button class="btn-teine" onclick="selectTeine('TEINE-03')">TEINE-03</button>
                </div>
                <div class="input-group">
                    <label>Eller skriv inn Teine-ID:</label>
                    <input type="text" id="custom-teine-id" placeholder="f.eks. TEINE-04" oninput="customTeineChanged(this.value)">
                </div>
            </div>

            <div class="card">
                <h2>2. REGISTRER FANGST I TEINA</h2>
                
                <div class="counter-row">
                    <span>🟢 Hummer (Lovlig minstemål)</span>
                    <div class="counter-controls">
                        <button class="btn-counter btn-minus" onclick="updateCount('legal', -1)">-</button>
                        <span id="count-legal" class="counter-val">0</span>
                        <button class="btn-counter btn-plus" onclick="updateCount('legal', 1)">+</button>
                    </div>
                </div>

                <div class="counter-row">
                    <span>🦀 Krabber</span>
                    <div class="counter-controls">
                        <button class="btn-counter btn-minus" onclick="updateCount('crab', -1)">-</button>
                        <span id="count-crab" class="counter-val">0</span>
                        <button class="btn-counter btn-plus" onclick="updateCount('crab', 1)">+</button>
                    </div>
                </div>

                <div class="counter-row">
                    <span>📏 Hummer under minstemål</span>
                    <div class="counter-controls">
                        <button class="btn-counter btn-minus" onclick="updateCount('under', -1)">-</button>
                        <span id="count-under" class="counter-val">0</span>
                        <button class="btn-counter btn-plus" onclick="updateCount('under', 1)">+</button>
                    </div>
                </div>

                <div class="counter-row">
                    <span>📏 Hummer over maksmål</span>
                    <div class="counter-controls">
                        <button class="btn-counter btn-minus" onclick="updateCount('over', -1)">-</button>
                        <span id="count-over" class="counter-val">0</span>
                        <button class="btn-counter btn-plus" onclick="updateCount('over', 1)">+</button>
                    </div>
                </div>

                <div class="counter-row">
                    <span>🥚 Hummer med rogn</span>
                    <div class="counter-controls">
                        <button class="btn-counter btn-minus" onclick="updateCount('berried', -1)">-</button>
                        <span id="count-berried" class="counter-val">0</span>
                        <button class="btn-counter btn-plus" onclick="updateCount('berried', 1)">+</button>
                    </div>
                </div>
            </div>

            <button class="btn-action btn-success" onclick="saveCatch('TREKK')">💾 REGISTRER TREKK (MED GPS)</button>
            <button class="btn-action btn-warning" onclick="saveCatch('SATT UT')">⚓ REGISTRER KUN UTSETT / FLYTTING</button>
        </div>

        <!-- TAB 2: HISTORIKK -->
        <div id="tab-history" class="tab-content">
            <div class="card">
                <h2>LOGGFØRTE TREKK OG UTSETT</h2>
                <div id="history-list">
                    <p style="color: var(--text-sub);">Ingen registreringer enda.</p>
                </div>
            </div>
        </div>

        <!-- TAB 3: QR-KODER -->
        <div id="tab-qr" class="tab-content">
            <div class="card">
                <h2>GENERER QR-KODE FOR TEINE</h2>
                <div class="input-group">
                    <label>Skriv inn Teine-ID:</label>
                    <input type="text" id="qr-input" value="TEINE-01">
                </div>
                <button class="btn-action btn-primary" onclick="generateQR()">Lag QR-kode</button>
                <div id="qrcode"></div>
            </div>
        </div>

        <!-- TAB 4: KART -->
        <div id="tab-map" class="tab-content">
            <div class="card">
                <h2>TEINEPLASSERINGER PÅ KART</h2>
                <div id="map"></div>
            </div>
        </div>

    </div>

    <!-- MENY NEDERST -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('register', this)">
            <span class="nav-item-icon">📝</span>
            <span>Registrer</span>
        </button>
        <button class="nav-item" onclick="switchTab('history', this)">
            <span class="nav-item-icon">📋</span>
            <span>Historikk</span>
        </button>
        <button class="nav-item" onclick="switchTab('qr', this)">
            <span class="nav-item-icon">📱</span>
            <span>QR-Koder</span>
        </button>
        <button class="nav-item" onclick="switchTab('map', this)">
            <span class="nav-item-icon">🗺️</span>
            <span>Kart</span>
        </button>
    </div>

    <!-- Leaflet JS for Kart -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let selectedTeine = 'TEINE-01';
        let counts = { legal: 0, crab: 0, under: 0, over: 0, berried: 0 };
        let logs = JSON.parse(localStorage.getItem('hummer_logs') || '[]');
        let map = null;
        let mapMarkers = [];

        function selectTeine(id) {
            selectedTeine = id;
            document.getElementById('custom-teine-id').value = '';
            document.querySelectorAll('.btn-teine').forEach(btn => {
                btn.classList.toggle('selected', btn.innerText === id);
            });
        }

        function customTeineChanged(val) {
            if (val.trim() !== '') {
                selectedTeine = val.trim();
                document.querySelectorAll('.btn-teine').forEach(btn => btn.classList.remove('selected'));
            }
        }

        function updateCount(type, delta) {
            counts[type] = Math.max(0, counts[type] + delta);
            document.getElementById(`count-${type}`).innerText = counts[type];
        }

        function resetCounts() {
            counts = { legal: 0, crab: 0, under: 0, over: 0, berried: 0 };
            for (let type in counts) {
                document.getElementById(`count-${type}`).innerText = 0;
            }
        }

        function saveCatch(actionType) {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        storeLog(actionType, pos.coords.latitude, pos.coords.longitude);
                    },
                    err => {
                        storeLog(actionType, null, null);
                    },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            } else {
                storeLog(actionType, null, null);
            }
        }

        function storeLog(actionType, lat, lng) {
            const entry = {
                id: Date.now(),
                teine: selectedTeine,
                action: actionType,
                counts: { ...counts },
                lat: lat,
                lng: lng,
                timestamp: new Date().toLocaleString('no-NO')
            };

            logs.unshift(entry);
            localStorage.setItem('hummer_logs', JSON.stringify(logs));
            alert(`Registrering lagret for ${selectedTeine}!`);
            resetCounts();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (logs.length === 0) {
                list.innerHTML = '<p style="color: var(--text-sub);">Ingen registreringer enda.</p>';
                return;
            }

            list.innerHTML = logs.map(item => `
                <div class="history-item">
                    <strong>${item.teine} (${item.action})</strong> - ${item.timestamp}<br>
                    🟢 Lovlig: ${item.counts.legal} | 🦀 Krabbe: ${item.counts.crab}<br>
                    📏 Undermål: ${item.counts.under} | Overmål: ${item.counts.over} | 🥚 Rogn: ${item.counts.berried}<br>
                    ${item.lat ? `📍 GPS: ${item.lat.toFixed(5)},${item.lng.toFixed(5)}` : '📍 GPS: Ikke tilgjengelig'}
                </div>
            `).join('');
        }

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`tab-${tabId}`).classList.add('active');
            if (el) el.classList.add('active');

            if (tabId === 'history') renderHistory();
            if (tabId === 'map') initOrUpdateMap();
        }

        function generateQR() {
            const val = document.getElementById('qr-input').value;
            const container = document.getElementById('qrcode');
            container.innerHTML = '';
            if (val) {
                new QRCode(container, {
                    text: val,
                    width: 180,
                    height: 180
                });
            }
        }

        function initOrUpdateMap() {
            setTimeout(() => {
                if (!map) {
                    map = L.map('map').setView([59.91, 10.75], 8); // Standard visning Norge (Oslofjorden/Østlandet)
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '© OpenStreetMap'
                    }).addTo(map);
                }

                // Fjern gamle markører
                mapMarkers.forEach(m => map.removeLayer(m));
                mapMarkers = [];

                let bounds = [];

                // Finn nyeste posisjon per teine
                const latestTeinePositions = {};
                logs.forEach(log => {
                    if (log.lat && log.lng && !latestTeinePositions[log.teine]) {
                        latestTeinePositions[log.teine] = log;
                    }
                });

                for (let teineId in latestTeinePositions) {
                    const log = latestTeinePositions[teineId];
                    const marker = L.marker([log.lat, log.lng]).addTo(map);
                    marker.bindPopup(`
                        <strong>${log.teine}</strong><br>
                        Sist registrert: ${log.action}<br>
                        Dato: ${log.timestamp}<br>
                        🟢 Lovlig: ${log.counts.legal} | 🦀 Krabbe: ${log.counts.crab}
                    `);
                    mapMarkers.push(marker);
                    bounds.push([log.lat, log.lng]);
                }

                if (bounds.length > 0) {
                    map.fitBounds(bounds, { padding: [50, 50] });
                }
            }, 200);
        }

        // Initialiser
        renderHistory();
    </script>
</body>
</html>
